<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PipCast</title>
  <style>
    :root {
      /* 舒适柔和的中性深灰配色，避免纯黑死板 */
      --bg-base: #181b24;
      --bg-surface: #222634;
      --card-bg: rgba(34, 38, 52, 0.82);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --accent-green: #34d399;
      --accent-red: #f43f5e;
      --accent-purple: #a78bfa;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 30%, #252a3a 0%, #181b24 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 极简顶栏 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(24, 27, 36, 0.6);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      z-index: 100;
      transition: transform 0.3s, opacity 0.3s;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    .logo-icon svg { width: 16px; height: 16px; fill: #fff; }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #f8fafc;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 主画布空间 */
    #stage-container {
      flex: 1;
      position: relative;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #screen-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    /* 极简中心引导卡（无多余营销文字） */
    #welcome-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      gap: 16px;
    }

    .minimal-picker-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 440px;
      text-align: center;
    }

    .picker-btn-grid {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .action-card-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px 14px;
      color: #f1f5f9;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-card-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .action-card-btn.primary {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(99, 102, 241, 0.18));
      border-color: rgba(56, 189, 248, 0.4);
    }
    .action-card-btn.primary:hover {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.28), rgba(99, 102, 241, 0.28));
      border-color: var(--accent);
    }

    .action-card-btn svg {
      width: 28px;
      height: 28px;
      stroke: var(--accent);
      stroke-width: 1.8;
      fill: none;
    }

    .action-card-btn span {
      font-size: 14px;
      font-weight: 600;
    }

    /* 悬浮人脸气泡 */
    #cam-bubble {
      position: absolute;
      bottom: 36px;
      right: 36px;
      width: 180px;
      height: 180px;
      cursor: grab;
      z-index: 50;
      touch-action: none;
      transition: box-shadow 0.25s ease;
    }

    #cam-bubble:active {
      cursor: grabbing;
    }

    .cam-inner-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #1c202d;
      transition: clip-path 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-radius 0.3s;
    }

    #cam-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
    }

    /* 气泡各种形状 */
    .shape-circle { border-radius: 50%; }
    .shape-squircle { border-radius: 28%; }
    .shape-rounded { border-radius: 20px; }
    .shape-hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
    .shape-oval { border-radius: 40% / 60%; }

    /* 发光边框 */
    .border-glow-blue {
      box-shadow: 0 0 0 3px var(--accent), 0 12px 28px rgba(56, 189, 248, 0.3);
    }
    .border-glow-purple {
      box-shadow: 0 0 0 3px var(--accent-purple), 0 12px 28px rgba(167, 139, 250, 0.3);
    }
    .border-glow-green {
      box-shadow: 0 0 0 3px var(--accent-green), 0 12px 28px rgba(52, 211, 153, 0.3);
    }
    .border-glow-none {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    /* 悬停微缩图标条 */
    .cam-hover-tools {
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 35, 48, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 3px 6px;
      display: none;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      z-index: 60;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    #cam-bubble:hover .cam-hover-tools {
      display: flex;
    }

    .cam-tool-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .cam-tool-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .cam-tool-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    /* 摄像头未开启时的占位状态 */
    .cam-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #272d3e, #1a1e2a);
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.2s;
      padding: 12px;
      text-align: center;
    }

    .cam-placeholder:hover {
      background: radial-gradient(circle at center, #30374c, #1f2331);
      color: var(--text);
    }

    .cam-placeholder svg {
      width: 32px;
      height: 32px;
      stroke: currentColor;
      stroke-width: 1.7;
      fill: none;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    .placeholder-title {
      font-size: 12px;
      font-weight: 600;
    }

    /* 极简精致底部控制 Dock（纯图标设计，如 Dynamic Island） */
    #dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      z-index: 90;
      transition: opacity 0.3s, transform 0.3s;
    }

    #dock.hidden-ui {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(24px);
    }

    .dock-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    /* 精致轻量图标按钮 */
    .icon-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .icon-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .icon-btn-pure {
      width: 36px;
      height: 36px;
      padding: 0;
      justify-content: center;
      border-radius: 50%;
    }

    /* 麦克风跳动电平 */
    .audio-meter {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      width: 16px;
      margin-left: 2px;
    }

    .ab-bar {
      width: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      height: 25%;
      transition: height 0.08s ease, background-color 0.1s;
    }
    .ab-bar.active { background: var(--accent-green); }

    /* 录制时间显示 */
    .timer-badge {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rec-pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-red);
      display: none;
    }
    .rec-pulse-dot.active {
      display: inline-block;
      animation: pulse-dot 1s infinite;
    }
    @keyframes pulse-dot { 50% { opacity: 0.2; } }

    /* 核心录制按钮 */
    .btn-record-pill {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
      transition: all 0.2s;
    }

    .btn-record-pill svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .btn-record-pill:hover {
      box-shadow: 0 6px 18px rgba(244, 63, 94, 0.5);
      transform: translateY(-1px);
    }

    .btn-record-pill.recording {
      animation: record-glow 1.6s infinite;
    }
    @keyframes record-glow {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }

    /* 3秒倒计时浮层 */
    #countdown-overlay {
      position: fixed;
      inset: 0;
      background: rgba(24, 27, 36, 0.7);
      backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 300;
    }

    .countdown-num {
      font-size: 100px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      animation: count-pop 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes count-pop {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 预览导出弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 18, 25, 0.75);
      backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
    }

    .modal-card {
      background: #1e222e;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 90vw;
      max-width: 760px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .video-preview-player {
      width: 100%;
      max-height: 440px;
      border-radius: 10px;
      background: #000;
    }

    .modal-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 极简 Toast */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-40px);
      background: rgba(30, 35, 48, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 400;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 离屏混合 Canvas */
    #composite-canvas { display: none; }
  </style>
</head>
<body>

<!-- 1. 极简顶栏 -->
<header id="main-header">
  <div class="brand">
    <div class="logo-icon">
      <!-- 极简录制镜头 SVG 图标 -->
      <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="3" ry="3"/></svg>
    </div>
    <span class="brand-title">PipCast</span>
  </div>

  <div class="header-actions">
    <button class="icon-btn icon-btn-pure" id="btnHelp" title="硬件提示与排查">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </button>
    <button class="icon-btn icon-btn-pure" id="btnCleanMode" title="沉浸展示模式 (快捷键: H)">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</header>

<!-- 2. 工作台画布 -->
<main id="stage-container">
  <!-- 屏幕共享渲染层 -->
  <video id="screen-video" autoplay playsinline muted></video>

  <!-- 中心轻量卡片（未共享屏幕时显示） -->
  <div id="welcome-hero">
    <div class="minimal-picker-card">
      <div style="font-size: 15px; font-weight: 600; color: #f1f5f9;">选择录制模式</div>
      <div class="picker-btn-grid">
        <button class="action-card-btn primary" id="heroBtnScreen">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <span>录制屏幕</span>
        </button>
        <button class="action-card-btn" id="heroBtnCam">
          <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          <span>纯镜头出镜</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 3. 悬浮人像镜头气泡 -->
  <div id="cam-bubble" class="border-glow-blue">
    <!-- 悬停快捷工具条（微缩图标） -->
    <div class="cam-hover-tools">
      <button class="cam-tool-btn" id="btnHoverShape" title="切换形状 (快捷键: S)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
      </button>
      <button class="cam-tool-btn" id="btnHoverMirror" title="水平镜像翻转">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3m8-18h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
      </button>
      <button class="cam-tool-btn" id="btnHoverBorder" title="切换发光边框">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>

    <!-- 气泡形状遮罩层 -->
    <div class="cam-inner-wrapper shape-circle" id="cam-wrapper">
      <video id="cam-video" autoplay playsinline muted></video>
      <div class="cam-placeholder" id="cam-placeholder">
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <span class="placeholder-title" id="placeholder-title">开启镜头</span>
      </div>
    </div>
  </div>

  <!-- 4. 底部极简图标 Dock 栏 -->
  <div id="dock">
    <!-- 屏幕选择 -->
    <button class="icon-btn" id="btnDockScreen" title="选择要共享捕获的屏幕/窗口/标签页">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span id="screenStatusText">屏幕</span>
    </button>

    <!-- 镜头开关 -->
    <button class="icon-btn" id="btnDockCam" title="开关悬浮摄像头 (快捷键: C)">
      <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <span id="camStatusText">镜头</span>
    </button>

    <!-- 形状切换 -->
    <button class="icon-btn icon-btn-pure" id="btnDockShape" title="切换几何形状 (快捷键: S)">
      <svg viewBox="0 0 24 24"><polygon points="12 2 2 22 22 22"/></svg>
    </button>

    <!-- 尺寸缩放 -->
    <button class="icon-btn icon-btn-pure" id="btnDockSize" title="切换气泡大小 (或在气泡上滑动滚轮)">
      <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>

    <div class="dock-divider"></div>

    <!-- 麦克风与动态跳动电平 -->
    <button class="icon-btn" id="btnDockMic" title="开关麦克风收音 (快捷键: M)">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      <div class="audio-meter">
        <div class="ab-bar" id="ab1"></div>
        <div class="ab-bar" id="ab2"></div>
        <div class="ab-bar" id="ab3"></div>
      </div>
    </button>

    <div class="dock-divider"></div>

    <!-- 录制时间显示 -->
    <div class="timer-badge">
      <span class="rec-pulse-dot" id="rec-dot"></span>
      <span id="timer-display">00:00</span>
    </div>

    <!-- 核心录制按钮 -->
    <button class="btn-record-pill" id="btnRecord">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
      <span id="recordBtnText">录制</span>
    </button>
  </div>
</main>

<!-- 5. 3秒沉浸式倒计时 -->
<div id="countdown-overlay">
  <div class="countdown-num" id="countdown-num">3</div>
</div>

<!-- 6. 录制完成预览弹窗 -->
<div class="modal-backdrop" id="preview-modal">
  <div class="modal-card">
    <div class="modal-top">
      <span style="font-weight: 600; font-size: 15px;">🎉 录制完成</span>
      <button class="icon-btn icon-btn-pure" id="btnCloseModal">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <video class="video-preview-player" id="modal-video" controls autoplay></video>
    <div class="modal-bottom">
      <span style="font-size: 12px; color: var(--text-muted);" id="rec-info-text">本地生成 · 60 FPS</span>
      <div style="display: flex; gap: 8px;">
        <button class="icon-btn" id="btnDiscard">🗑️ 放弃</button>
        <button class="btn-record-pill" id="btnDownload" style="background: linear-gradient(135deg, #38bdf8, #2563eb);">
          ⬇️ 下载文件
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 7. 轻量硬件提示弹窗 -->
<div class="modal-backdrop" id="help-modal">
  <div class="modal-card" style="max-width: 480px;">
    <div class="modal-top">
      <span style="font-weight: 600; font-size: 15px;">💡 硬件与使用提示</span>
      <button class="icon-btn icon-btn-pure" id="btnCloseHelp">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="font-size: 13px; line-height: 1.7; color: #cbd5e1; display: flex; flex-direction: column; gap: 10px;">
      <div>• <strong>本地文件即开即用</strong>：本应用是 100% 纯本地单文件，直接在浏览器双击打开即可正常调用摄像头与屏幕，无需额外启动任何本地服务器。</div>
      <div>• <strong>MacBook 外接屏合盖</strong>：若笔记本盖子闭合，macOS 会对自带镜头物理断电。只需掀开屏幕一条缝即可通电。</div>
      <div>• <strong>iPhone 连续互通相机</strong>：若用 iPhone 作为超清镜头，请将 iPhone 保持<strong>黑屏锁屏且横放固定</strong>。</div>
      <div>• <strong>快捷键</strong>：<span style="font-family: monospace; color: var(--accent);">H</span> 沉浸模式 / <span style="font-family: monospace; color: var(--accent);">S</span> 切换形状 / <span style="font-family: monospace; color: var(--accent);">C</span> 镜头开关 / <span style="font-family: monospace; color: var(--accent);">M</span> 麦克风静音。</div>
    </div>
  </div>
</div>

<!-- 离屏渲染与混合画布 -->
<canvas id="composite-canvas"></canvas>

<!-- 浮动通知 Toast -->
<div id="toast">已就绪</div>

<script>
  /* =========================================================
     PipCast — 纯本地极简核心 (100% 本地文件双击即用)
     ========================================================= */

  let screenStream = null;
  let camStream = null;
  let micStream = null;
  let audioContext = null;
  let analyserNode = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordedBlob = null;

  let isCameraActive = false;
  let isMicActive = true;
  let isRecording = false;
  let isCleanMode = false;
  let isMirrored = true;
  let isSelectingScreen = false;

  let recordSeconds = 0;
  let timerInterval = null;

  // 形状与样式
  const shapes = ['shape-circle', 'shape-squircle', 'shape-rounded', 'shape-hexagon', 'shape-oval'];
  let currentShapeIdx = 0;

  const borders = ['border-glow-blue', 'border-glow-purple', 'border-glow-green', 'border-glow-none'];
  let currentBorderIdx = 0;

  const sizes = [120, 180, 240, 320];
  let currentSizeIdx = 1; // 180px

  // DOM 元素引用
  const stage = document.getElementById('stage-container');
  const screenVideo = document.getElementById('screen-video');
  const welcomeHero = document.getElementById('welcome-hero');
  const camBubble = document.getElementById('cam-bubble');
  const camWrapper = document.getElementById('cam-wrapper');
  const camVideo = document.getElementById('cam-video');
  const camPlaceholder = document.getElementById('cam-placeholder');
  const placeholderTitle = document.getElementById('placeholder-title');

  const mainHeader = document.getElementById('main-header');
  const dock = document.getElementById('dock');
  const btnDockScreen = document.getElementById('btnDockScreen');
  const btnDockCam = document.getElementById('btnDockCam');
  const btnDockShape = document.getElementById('btnDockShape');
  const btnDockSize = document.getElementById('btnDockSize');
  const btnDockMic = document.getElementById('btnDockMic');
  const btnRecord = document.getElementById('btnRecord');
  const recordBtnText = document.getElementById('recordBtnText');
  const recDot = document.getElementById('rec-dot');
  const timerDisplay = document.getElementById('timer-display');
  const screenStatusText = document.getElementById('screenStatusText');
  const camStatusText = document.getElementById('camStatusText');

  const heroBtnScreen = document.getElementById('heroBtnScreen');
  const heroBtnCam = document.getElementById('heroBtnCam');

  const btnHoverShape = document.getElementById('btnHoverShape');
  const btnHoverMirror = document.getElementById('btnHoverMirror');
  const btnHoverBorder = document.getElementById('btnHoverBorder');

  const btnCleanMode = document.getElementById('btnCleanMode');
  const btnHelp = document.getElementById('btnHelp');
  const helpModal = document.getElementById('help-modal');
  const btnCloseHelp = document.getElementById('btnCloseHelp');

  const countdownOverlay = document.getElementById('countdown-overlay');
  const countdownNum = document.getElementById('countdown-num');

  const previewModal = document.getElementById('preview-modal');
  const modalVideo = document.getElementById('modal-video');
  const btnCloseModal = document.getElementById('btnCloseModal');
  const btnDownload = document.getElementById('btnDownload');
  const btnDiscard = document.getElementById('btnDiscard');
  const recInfoText = document.getElementById('rec-info-text');

  const toast = document.getElementById('toast');
  const canvas = document.getElementById('composite-canvas');
  const ctx = canvas.getContext('2d');

  const ab1 = document.getElementById('ab1');
  const ab2 = document.getElementById('ab2');
  const ab3 = document.getElementById('ab3');

  function showToast(msg) {
    toast.innerText = msg;
    toast.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  /* =========================================================
     1. 摄像头直接启动（和用户原版 PPT 相同机制，纯净直连）
     ========================================================= */

  async function initCamera() {
    placeholderTitle.innerText = '唤醒中...';
    try {
      // 简单直连，不绕复杂循环，本地文件秒开
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false
      });
    } catch (e) {
      try {
        // 极简保底
        camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      } catch (err) {
        console.warn('Camera failed:', err);
        placeholderTitle.innerText = '开启镜头';
        if (err.name === 'NotFoundError') {
          showToast('未检测到摄像头 (若Mac合盖请掀开屏幕)');
        } else {
          showToast('摄像头无法启动，请检查权限');
        }
        return;
      }
    }

    if (camStream) {
      camVideo.srcObject = camStream;
      camVideo.style.display = 'block';
      camPlaceholder.style.display = 'none';
      isCameraActive = true;
      btnDockCam.classList.add('active');
      camStatusText.innerText = '镜头 开';
      showToast('摄像头已开启');
    }
  }

  function toggleCamera() {
    if (isCameraActive) {
      if (camStream) {
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
      }
      camVideo.srcObject = null;
      camVideo.style.display = 'none';
      camPlaceholder.style.display = 'flex';
      placeholderTitle.innerText = '开启镜头';
      isCameraActive = false;
      btnDockCam.classList.remove('active');
      camStatusText.innerText = '镜头';
    } else {
      initCamera();
    }
  }

  camPlaceholder.addEventListener('click', () => initCamera());
  btnDockCam.addEventListener('click', toggleCamera);

  /* =========================================================
     2. 屏幕共享选择（防死循环闭环）
     ========================================================= */

  async function selectScreen() {
    if (isSelectingScreen) return;
    isSelectingScreen = true;

    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: { ideal: 60 } },
        audio: true
      });

      screenVideo.srcObject = screenStream;
      screenVideo.style.display = 'block';
      welcomeHero.style.display = 'none';
      btnDockScreen.classList.add('active');
      screenStatusText.innerText = '屏幕 已选';

      screenStream.getVideoTracks()[0].onended = () => {
        screenVideo.style.display = 'none';
        screenStream = null;
        btnDockScreen.classList.remove('active');
        screenStatusText.innerText = '屏幕';
        if (!isCameraActive) welcomeHero.style.display = 'flex';
        if (isRecording) stopRecording();
      };
      showToast('屏幕已连接');
    } catch (e) {
      if (e.name !== 'NotAllowedError') {
        console.warn('Screen selection:', e);
      }
    } finally {
      isSelectingScreen = false;
    }
  }

  btnDockScreen.addEventListener('click', selectScreen);
  heroBtnScreen.addEventListener('click', async () => {
    if (!isCameraActive) initCamera();
    await selectScreen();
  });

  heroBtnCam.addEventListener('click', () => {
    welcomeHero.style.display = 'none';
    if (!isCameraActive) initCamera();
    showToast('已进入纯出镜录制');
  });

  /* =========================================================
     3. 麦克风收音与电平跳动
     ========================================================= */

  async function setupMic() {
    if (!audioContext) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioCtx();
    }
    if (audioContext.state === 'suspended') await audioContext.resume();

    if (!micStream || !micStream.active) {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        console.warn('Mic declined:', err);
        showToast('麦克风未授权');
        isMicActive = false;
        btnDockMic.classList.remove('active');
        return;
      }
    }

    if (micStream && micStream.getAudioTracks().length > 0) {
      try {
        const source = audioContext.createMediaStreamSource(micStream);
        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 32;
        source.connect(analyserNode);
        runAudioLoop();
      } catch (e) {}
    }
  }

  function runAudioLoop() {
    if (!analyserNode) return;
    const data = new Uint8Array(analyserNode.frequencyBinCount);

    function frame() {
      if (!isMicActive || !micStream || !micStream.active) {
        [ab1, ab2, ab3].forEach(b => { b.style.height = '20%'; b.classList.remove('active'); });
        return;
      }
      analyserNode.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length;
      const pct = Math.min(100, Math.max(15, (avg / 120) * 100));

      ab1.style.height = `${pct * 0.6}%`;
      ab2.style.height = `${pct * 1.0}%`;
      ab3.style.height = `${pct * 0.7}%`;

      const active = avg > 8;
      [ab1, ab2, ab3].forEach(b => b.classList.toggle('active', active));

      requestAnimationFrame(frame);
    }
    frame();
  }

  btnDockMic.addEventListener('click', async () => {
    isMicActive = !isMicActive;
    if (isMicActive) {
      btnDockMic.classList.add('active');
      await setupMic();
      showToast('麦克风收音已开启');
    } else {
      btnDockMic.classList.remove('active');
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      showToast('麦克风已静音');
    }
  });

  document.addEventListener('click', () => {
    if (!audioContext && isMicActive) setupMic();
  }, { once: true });

  /* =========================================================
     4. 形状、发光、缩放与拖拽
     ========================================================= */

  function applyShape(idx) {
    currentShapeIdx = idx % shapes.length;
    shapes.forEach(s => camWrapper.classList.remove(s));
    camWrapper.classList.add(shapes[currentShapeIdx]);
  }

  btnHoverShape.addEventListener('click', (e) => { e.stopPropagation(); applyShape(currentShapeIdx + 1); });
  btnDockShape.addEventListener('click', () => applyShape(currentShapeIdx + 1));

  btnHoverBorder.addEventListener('click', (e) => {
    e.stopPropagation();
    currentBorderIdx = (currentBorderIdx + 1) % borders.length;
    borders.forEach(b => camBubble.classList.remove(b));
    camBubble.classList.add(borders[currentBorderIdx]);
  });

  btnHoverMirror.addEventListener('click', (e) => {
    e.stopPropagation();
    isMirrored = !isMirrored;
    camVideo.style.transform = isMirrored ? 'scaleX(-1)' : 'scaleX(1)';
  });

  btnDockSize.addEventListener('click', () => {
    currentSizeIdx = (currentSizeIdx + 1) % sizes.length;
    const s = sizes[currentSizeIdx];
    camBubble.style.width = `${s}px`;
    camBubble.style.height = `${s}px`;
    showToast(`尺寸: ${s}px`);
  });

  // 滚轮无级缩放气泡
  camBubble.addEventListener('wheel', (e) => {
    e.preventDefault();
    let w = camBubble.offsetWidth;
    w = e.deltaY < 0 ? Math.min(w + 14, 360) : Math.max(w - 14, 90);
    camBubble.style.width = `${w}px`;
    camBubble.style.height = `${w}px`;
  });

  // 自由拖拽定位
  let isDragging = false;
  let dragX, dragY, initL, initT;

  camBubble.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    isDragging = true;
    dragX = e.clientX;
    dragY = e.clientY;
    const r = camBubble.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    initL = r.left - sr.left;
    initT = r.top - sr.top;
    camBubble.style.bottom = 'auto';
    camBubble.style.right = 'auto';
    camBubble.style.left = `${initL}px`;
    camBubble.style.top = `${initT}px`;
    camBubble.setPointerCapture(e.pointerId);
  });

  camBubble.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragX;
    const dy = e.clientY - dragY;
    const sr = stage.getBoundingClientRect();
    const bw = camBubble.offsetWidth;
    const bh = camBubble.offsetHeight;

    camBubble.style.left = `${Math.max(10, Math.min(initL + dx, sr.width - bw - 10))}px`;
    camBubble.style.top = `${Math.max(10, Math.min(initT + dy, sr.height - bh - 10))}px`;
  });

  camBubble.addEventListener('pointerup', (e) => {
    isDragging = false;
    camBubble.releasePointerCapture(e.pointerId);
  });

  /* =========================================================
     5. 沉浸模式 (H 键)
     ========================================================= */

  function toggleClean() {
    isCleanMode = !isCleanMode;
    dock.classList.toggle('hidden-ui', isCleanMode);
    mainHeader.style.display = isCleanMode ? 'none' : 'flex';
    showToast(isCleanMode ? '沉浸模式 (按 H 恢复)' : '已恢复工具栏');
  }

  btnCleanMode.addEventListener('click', toggleClean);

  /* =========================================================
     6. 60 FPS 录制与 Canvas 实时合成
     ========================================================= */

  function drawComposite() {
    if (!isRecording) return;

    if (screenVideo.style.display !== 'none' && screenVideo.videoWidth) {
      ctx.drawImage(screenVideo, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.fillStyle = "#181b24";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (isCameraActive && camVideo.videoWidth) {
      const sr = stage.getBoundingClientRect();
      const br = camBubble.getBoundingClientRect();
      const sx = canvas.width / sr.width;
      const sy = canvas.height / sr.height;

      const cx = (br.left - sr.left) * sx;
      const cy = (br.top - sr.top) * sy;
      const cw = br.width * sx;
      const ch = br.height * sy;

      ctx.save();
      ctx.beginPath();

      const sh = shapes[currentShapeIdx];
      if (sh === 'shape-circle') {
        ctx.arc(cx + cw / 2, cy + ch / 2, cw / 2, 0, Math.PI * 2);
      } else if (sh === 'shape-squircle' || sh === 'shape-rounded') {
        const rad = sh === 'shape-squircle' ? cw * 0.28 : cw * 0.12;
        ctx.roundRect(cx, cy, cw, ch, rad);
      } else if (sh === 'shape-hexagon') {
        ctx.moveTo(cx + cw * 0.25, cy);
        ctx.lineTo(cx + cw * 0.75, cy);
        ctx.lineTo(cx + cw, cy + ch * 0.5);
        ctx.lineTo(cx + cw * 0.75, cy + ch);
        ctx.lineTo(cx + cw * 0.25, cy + ch);
        ctx.lineTo(cx, cy + ch * 0.5);
        ctx.closePath();
      } else {
        ctx.arc(cx + cw / 2, cy + ch / 2, cw / 2, 0, Math.PI * 2);
      }
      ctx.clip();

      if (isMirrored) {
        ctx.translate(cx + cw, cy);
        ctx.scale(-1, 1);
        ctx.drawImage(camVideo, 0, 0, cw, ch);
      } else {
        ctx.drawImage(camVideo, cx, cy, cw, ch);
      }
      ctx.restore();

      // 发光环绘制
      if (borders[currentBorderIdx] !== 'border-glow-none') {
        ctx.save();
        ctx.lineWidth = 4 * sx;
        ctx.strokeStyle = borders[currentBorderIdx].includes('purple') ? '#a78bfa' : (borders[currentBorderIdx].includes('green') ? '#34d399' : '#38bdf8');
        ctx.beginPath();
        if (sh === 'shape-circle') {
          ctx.arc(cx + cw / 2, cy + ch / 2, cw / 2, 0, Math.PI * 2);
        } else {
          ctx.roundRect(cx, cy, cw, ch, cw * 0.28);
        }
        ctx.stroke();
        ctx.restore();
      }
    }

    requestAnimationFrame(drawComposite);
  }

  function startCountdown() {
    let c = 3;
    countdownNum.innerText = c;
    countdownOverlay.style.display = 'flex';

    const interval = setInterval(() => {
      c--;
      if (c > 0) {
        countdownNum.innerText = c;
      } else {
        clearInterval(interval);
        countdownOverlay.style.display = 'none';
        beginRecording();
      }
    }, 850);
  }

  async function beginRecording() {
    recordedChunks = [];
    canvas.width = 1920;
    canvas.height = 1080;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!audioContext) audioContext = new AudioCtx();
    if (audioContext.state === 'suspended') await audioContext.resume();

    const dest = audioContext.createMediaStreamDestination();

    if (screenStream && screenStream.getAudioTracks().length > 0) {
      try {
        audioContext.createMediaStreamSource(screenStream).connect(dest);
      } catch (e) {}
    }

    if (isMicActive) {
      if (!micStream || !micStream.active) await setupMic();
      if (micStream && micStream.getAudioTracks().length > 0) {
        try {
          audioContext.createMediaStreamSource(micStream).connect(dest);
        } catch (e) {}
      }
    }

    const stream = canvas.captureStream(60);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));

    let mimeType = 'video/webm;codecs=vp9,opus';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
    }

    try {
      mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
    } catch (e) {
      mediaRecorder = new MediaRecorder(stream);
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
      modalVideo.src = URL.createObjectURL(recordedBlob);
      const mb = (recordedBlob.size / (1024 * 1024)).toFixed(1);
      recInfoText.innerText = `大小: ${mb} MB · 时长: ${timerDisplay.innerText}`;
      previewModal.style.display = 'flex';

      btnRecord.classList.remove('recording');
      recordBtnText.innerText = '录制';
      recDot.classList.remove('active');
      clearInterval(timerInterval);
    };

    mediaRecorder.start(200);
    isRecording = true;
    drawComposite();

    btnRecord.classList.add('recording');
    recordBtnText.innerText = '停止';
    recDot.classList.add('active');
    recordSeconds = 0;
    timerDisplay.innerText = '00:00';

    timerInterval = setInterval(() => {
      recordSeconds++;
      const m = Math.floor(recordSeconds / 60).toString().padStart(2, '0');
      const s = (recordSeconds % 60).toString().padStart(2, '0');
      timerDisplay.innerText = `${m}:${s}`;
    }, 1000);

    showToast('🔴 录制已开始 (按 H 隐藏工具栏)');
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
    }
  }

  btnRecord.addEventListener('click', () => {
    if (isRecording) {
      stopRecording();
    } else {
      if (!screenStream && !isCameraActive) {
        welcomeHero.style.display = 'none';
        initCamera();
      }
      startCountdown();
    }
  });

  /* =========================================================
     7. 下载与重录
     ========================================================= */

  btnDownload.addEventListener('click', () => {
    if (!recordedBlob) return;
    const a = document.createElement('a');
    a.href = modalVideo.src;
    const ext = recordedBlob.type.includes('mp4') ? 'mp4' : 'webm';
    a.download = `PipCast_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.${ext}`;
    a.click();
    showToast('视频已保存');
  });

  btnCloseModal.addEventListener('click', () => {
    previewModal.style.display = 'none';
    modalVideo.pause();
  });

  btnDiscard.addEventListener('click', () => {
    if (confirm('确认放弃本段录制？')) {
      previewModal.style.display = 'none';
      modalVideo.pause();
      recordedBlob = null;
    }
  });

  /* 帮助弹窗 */
  btnHelp.addEventListener('click', () => helpModal.style.display = 'flex');
  btnCloseHelp.addEventListener('click', () => helpModal.style.display = 'none');

  /* 键盘快捷键 */
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'KeyH') toggleClean();
    else if (e.code === 'KeyC') toggleCamera();
    else if (e.code === 'KeyS') applyShape(currentShapeIdx + 1);
    else if (e.code === 'KeyM') btnDockMic.click();
  });
</script>
</body>
</html>
